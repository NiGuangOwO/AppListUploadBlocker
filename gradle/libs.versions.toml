[versions]
agp = "9.4.0"
kotlin = "2.4.20"
xposed-api = "102.0.0"
xposed-service = "102.0.0"
dexkit = "2.2.0"
activity-compose = "1.12.0"
miuix = "0.9.4"

[libraries]
libxposed-api = { module = "io.github.libxposed:api", version.ref = "xposed-api" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "xposed-service" }
dexkit = { module = "org.luckypray:dexkit", version.ref = "dexkit" }

androidx-annotation = { module = "androidx.annotation:annotation", version = "1.10.0" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui-android", version.ref = "miuix" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
